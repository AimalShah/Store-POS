name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installer
    # `windows-latest` has moved to Visual Studio 18, which node-gyp 9 (used by
    # the locked Electron rebuild tooling) cannot detect. Pin the compatible
    # hosted image until that toolchain is upgraded.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          # node-gyp 9 does not support Python 3.12, the default on hosted
          # runners. setup-python exposes this absolute path as pythonLocation.
          npm_config_python: ${{ env.pythonLocation }}\python.exe

      - name: Build NSIS installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-runner
          path: release/win-unpacked
          if-no-files-found: error
          retention-days: 14
