name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-runner
          path: release/win-unpacked
          if-no-files-found: error
          retention-days: 14
