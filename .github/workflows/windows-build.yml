name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installer
    # `windows-latest` has moved to Visual Studio 18, which node-gyp 9 (used by
    # the locked Electron rebuild tooling) cannot detect. Pin the compatible
    # hosted image until that toolchain is upgraded.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 v12.12.0 publishes a prebuild for Node 22. Node 24
          # falls back to a native compile on the hosted runner.
          node-version: 22
          cache: npm

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          # Avoid npm's deprecated/unknown `python` config while still giving
          # node-gyp 9 a supported Python version if a compile is needed.
          NODE_GYP_FORCE_PYTHON: ${{ env.pythonLocation }}\python.exe

      - name: Build NSIS installer
        # better-sqlite3 is an N-API module. Rebuilding it for Electron invokes
        # the same native compiler that failed during npm ci on Node 24.
        run: npm run build && npx electron-builder --win --config.npmRebuild=false --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-runner
          path: release/win-unpacked
          if-no-files-found: error
          retention-days: 14
