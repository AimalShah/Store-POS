name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    # `windows-latest` has moved to Visual Studio 18, which node-gyp 9 (used by
    # the locked Electron rebuild tooling) cannot detect. Pin the compatible
    # hosted image until that toolchain is upgraded.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 v12.12.0 publishes a prebuild for Node 22. Node 24
          # falls back to a native compile on the hosted runner.
          node-version: 22
          cache: npm

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          # Avoid npm's deprecated/unknown `python` config while still giving
          # node-gyp 9 a supported Python version if a compile is needed.
          NODE_GYP_FORCE_PYTHON: ${{ env.pythonLocation }}\python.exe

      - name: Run unit tests
        # better-sqlite3 ships a Node-ABI prebuild after `npm ci`, which is what
        # Vitest needs. `pretest` re-fetches it via scripts/use-native.mjs.
        run: npm test

      - name: Switch better-sqlite3 to the Electron ABI
        # better-sqlite3 is compiled against a V8 ABI, so Node and Electron each
        # need their own binary. This downloads the matching prebuild for
        # Electron (e.g. electron-v148 for Electron 43) — no compiler needed.
        run: npm run native:electron

      - name: Build NSIS installer
        # electron-builder's automatic rebuild (npmRebuild) is disabled because
        # it recompiles from source and hits node-gyp 9 toolchain limits on the
        # hosted runners. The binary is already Electron-ready above, so the
        # packaged app can use it as-is.
        #
        # On a `v*` tag we publish the installer to a GitHub Release
        # (electron-updater reads this metadata for auto-updates). On other
        # pushes we just build locally and upload artifacts.
        run: npm run build && npx electron-builder --win --config.npmRebuild=false ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked Windows app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Store-POS-Windows-runner
          path: release/win-unpacked
          if-no-files-found: error
          retention-days: 14
